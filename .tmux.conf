# ~/.tmux.conf - Standard tmux configuration

# ============================================================================
# General Settings
# ============================================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach, like screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (click to switch panes, resize, select, etc.)
set -g mouse on

# Start windows and panes at 1, not 0 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Address vim mode switching delay
set -s escape-time 0

# Increase tmux messages display duration
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Enable focus events (useful for vim/nvim)
set -g focus-events on

# Enable 256 color support
set -g default-terminal "screen-256color"
# Or use this for true color support in modern terminals:
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*256col*:Tc"

# ============================================================================
# Key Bindings
# ============================================================================

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (more intuitive than " and %)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easy window navigation
bind -n C-Left previous-window
bind -n C-Right next-window

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# ============================================================================
# Copy Mode (Vi-style)
# ============================================================================

# Use vi mode in copy mode
setw -g mode-keys vi

# Vi-style copy/paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# Copy to system clipboard (macOS)
# For Linux, replace 'pbcopy' with 'xclip -selection clipboard' or 'xsel --clipboard --input'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Enter copy mode with Prefix + [
# Navigate with vi keys (h,j,k,l)
# Start selection with 'v'
# Copy with 'y'
# Paste with Prefix + ]

# ============================================================================
# Status Bar
# ============================================================================

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style bg=colour234,fg=colour137

# Left status bar: session name
set -g status-left '#[fg=colour233,bg=colour245,bold] #S '
set -g status-left-length 20

# Right status bar: date and time
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window status format
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# ============================================================================
# Pane Borders
# ============================================================================

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# ============================================================================
# Messaging
# ============================================================================

set -g message-style fg=colour232,bg=colour166,bold

# ============================================================================
# Additional Useful Bindings
# ============================================================================

# Synchronize panes (send commands to all panes)
bind S set-window-option synchronize-panes\; display "Synchronize panes toggled!"

# Kill pane without confirmation
bind x kill-pane

# Kill window without confirmation
bind & kill-window

# Clear screen and scrollback buffer
bind -n C-k send-keys -R \; send-keys C-l \; clear-history

# ============================================================================
# Plugins (Optional - using TPM - Tmux Plugin Manager)
# ============================================================================
# To use plugins, first install TPM:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Then uncomment the following lines and press Prefix + I to install plugins:

# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save/restore sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'  # Auto-save sessions
# set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless vim-tmux navigation

# Initialize TMUX plugin manager (keep this line at the very bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# Notes
# ============================================================================
# 
# Common tmux commands:
# - Prefix (Ctrl-a by default in this config)
# - Prefix + c: Create new window
# - Prefix + ,: Rename window
# - Prefix + |: Split pane horizontally
# - Prefix + -: Split pane vertically
# - Prefix + arrow: Navigate panes
# - Prefix + d: Detach from session
# - Prefix + [: Enter copy mode
# - Prefix + ]: Paste
# - Prefix + r: Reload config
#
# Outside tmux:
# - tmux: Start new session
# - tmux new -s name: Start named session
# - tmux ls: List sessions
# - tmux attach -t name: Attach to session
# - tmux kill-session -t name: Kill session
